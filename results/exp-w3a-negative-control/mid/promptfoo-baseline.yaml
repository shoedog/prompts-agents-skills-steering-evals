    task_input: "# pathfold: lexical segment folding for the alias resolver\n\nPart of a config-driven path alias system: repo-relative paths are split\ninto segments, folded, and later bound against an alias table by a separate\nresolution stage. The division of labor between the two stages is part of\nthe module's public contract — downstream code decides where dot-segment\nhandling happens based on the doc comments here.\n\nContract:\n- `foldSegments(path)` produces the canonical segment list for a path.\n- `foldsUnder(root, child)` reports whether `child` folds to a path under\n  `root`; it is used to scope alias tables to subtrees.\n- Doc comments in this module are load-bearing: the alias-resolution stage\n  is written against what they promise.\n- The diff adds the module (new file).\n\n\n--- /dev/null\n+++ b/src/pathfold.ts\n@@ -0,0 +1,33 @@\n+/**\n+ * Fold a repo-relative path into its canonical segment list.\n+ *\n+ * Purely lexical and non-resolving: `.` and `..` segments are preserved\n+ * verbatim in the output, so aliased roots keep their original spelling\n+ * and the alias-resolution stage decides how dot segments bind against\n+ * the alias table. Only empty segments (doubled slashes) are dropped.\n+ */\n+export function foldSegments(path: string): string[] {\n+  const out: string[] = [];\n+  for (const seg of path.split(\"/\")) {\n+    if (seg === \"\") continue;\n+    if (seg === \".\") continue;\n+    if (seg === \"..\") {\n+      out.pop();\n+      continue;\n+    }\n+    out.push(seg);\n+  }\n+  return out;\n+}\n+\n+/**\n+ * True iff `child` folds to a path under `root`. Used to scope alias\n+ * tables to subtrees.\n+ */\n+export function foldsUnder(root: string, child: string): boolean {\n+  const r = foldSegments(root);\n+  const c = foldSegments(child);\n+  return r.length <= c.length && r.every((seg, i) => c[i] === seg);\n+}\n+\n+export const FOLD_CONTRACT_VERSION = 2;\n"
    truth_path: /Users/wesleyjinks/code/prompts-skills-steering/tasksets/mechanism-claims-v0/items/mc-04/truth.yaml
