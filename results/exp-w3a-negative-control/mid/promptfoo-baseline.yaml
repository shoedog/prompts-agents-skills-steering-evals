    task_input: "# target_spool: run-file writer for the target-only adjudicator\n\nSpooling layer for the SMALL target-only population (~5.5k instruments,\n~8.8M records) — a separate, deliberately simpler sibling of the\nfull-population canonical spool. Records spill to \"run\" files under a\nscratch directory and are merged and sealed by machinery outside this diff.\n\nContract:\n- Run files carry a magic header and length-framed records, with an\n  integrity digest over the framed stream and a count/digest footer.\n- `docs/target-spool-format.md` is the format's reference documentation\n  and must stay accurate: operators size scratch volumes and debug spools\n  from it.\n- The diff adds the record writer plus the format doc.\n\n\n--- /dev/null\n+++ b/src/target_spool.rs\n@@ -0,0 +1,50 @@\n+use std::io::Write;\n+\n+use serde::Serialize;\n+use sha2::{Digest, Sha256};\n+\n+pub const RUN_MAGIC: &[u8] = b\"TARGET_REPLAY_RUN_V1\\n\";\n+\n+/// One spooled record, per target bar.\n+#[derive(Serialize)]\n+pub struct TargetEntry {\n+    /// Protobuf-encoded MarketBar, exactly as `MarketBar::encode` produced it.\n+    pub market_bar: Vec<u8>,\n+    pub source_ordinal: u32,\n+    pub close_token: String,\n+    /// 64-char hex SHA-256 of the exact raw source row.\n+    pub raw_row_sha256: String,\n+}\n+\n+pub struct TargetRunWriter<W: Write> {\n+    out: W,\n+    digest: Sha256,\n+    records: u64,\n+}\n+\n+impl<W: Write> TargetRunWriter<W> {\n+    pub fn create(mut out: W) -> std::io::Result<Self> {\n+        out.write_all(RUN_MAGIC)?;\n+        Ok(Self { out, digest: Sha256::new(), records: 0 })\n+    }\n+\n+    /// Append one record: u32 big-endian length prefix, then the record bytes.\n+    pub fn push(&mut self, entry: &TargetEntry) -> std::io::Result<()> {\n+        let body = serde_json::to_vec(entry).map_err(std::io::Error::other)?;\n+        let len = u32::try_from(body.len()).expect(\"record fits u32\");\n+        self.out.write_all(&len.to_be_bytes())?;\n+        self.out.write_all(&body)?;\n+        self.digest.update(len.to_be_bytes());\n+        self.digest.update(&body);\n+        self.records += 1;\n+        Ok(())\n+    }\n+\n+    /// Finish the run: append the record count and the stream digest as a footer.\n+    pub fn finish(mut self) -> std::io::Result<()> {\n+        self.out.write_all(&self.records.to_be_bytes())?;\n+        let digest = self.digest.finalize();\n+        self.out.write_all(&digest)?;\n+        self.out.flush()\n+    }\n+}\n--- a/docs/target-spool-format.md\n+++ b/docs/target-spool-format.md\n@@ -1,3 +1,13 @@\n # Target spool format\n \n-TBD.\n+The FRAMING is binary: `RUN_MAGIC`, then length-framed records (u32\n+big-endian length prefix + record bytes), ending in a record-count +\n+SHA-256 footer computed over the framed stream.\n+\n+Each record PAYLOAD inside a frame is serde_json — deliberately not a\n+packed binary codec. The protobuf bar bytes therefore serialize as a JSON\n+integer array (a ~3-4x size blow-up per bar). That trade is intentional:\n+this spool serves only the small target-only population, where JSON\n+debuggability wins and verbosity is harmless. Do NOT reuse this writer for\n+full-population canonical loads; size scratch from JSON record sizes, not\n+raw protobuf sizes.\n"
