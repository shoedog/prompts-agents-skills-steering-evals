    task_input: "# replay_spool: external-sort run files (writer, first cut)\n\nSpooling layer for a canonical-data backfill: records are buffered, spilled\nto sorted \"run\" files under a scratch directory, then merged and finally\nsealed; an emitter reads the sealed run back one instrument group at a time.\n\nContract:\n- Run files carry a magic header and length-framed records, with an\n  integrity digest over the framed stream and a count/digest footer.\n- `docs/spool-format.md` is the format's reference documentation and must\n  stay accurate: operators size scratch volumes and debug spools from it.\n- The diff adds the first cut of the record writer plus the format doc.\n\n\n--- /dev/null\n+++ b/src/replay_spool.rs\n@@ -0,0 +1,57 @@\n+use std::io::Write;\n+\n+use serde::Serialize;\n+use sha2::{Digest, Sha256};\n+\n+pub const RUN_MAGIC: &[u8] = b\"REPLAY_RUN_V2\\n\";\n+\n+/// One spooled record, per bar.\n+#[derive(Serialize)]\n+pub struct Entry {\n+    /// Protobuf-encoded MarketBar, exactly as `MarketBar::encode` produced it.\n+    pub market_bar: Vec<u8>,\n+    pub source_ordinal: u32,\n+    pub close_token: String,\n+    pub closeadj_token: String,\n+    /// 64-char hex SHA-256 of the exact raw source row.\n+    pub raw_row_sha256: String,\n+}\n+\n+pub struct RunWriter<W: Write> {\n+    out: W,\n+    digest: Sha256,\n+    records: u64,\n+}\n+\n+impl<W: Write> RunWriter<W> {\n+    pub fn create(mut out: W) -> std::io::Result<Self> {\n+        out.write_all(RUN_MAGIC)?;\n+        Ok(Self { out, digest: Sha256::new(), records: 0 })\n+    }\n+\n+    /// Append one record: u32 big-endian length prefix, then the record bytes.\n+    pub fn push(&mut self, entry: &Entry) -> std::io::Result<()> {\n+        let body = encode_entry(entry)?;\n+        let len = u32::try_from(body.len()).expect(\"record fits u32\");\n+        self.out.write_all(&len.to_be_bytes())?;\n+        self.out.write_all(&body)?;\n+        self.digest.update(len.to_be_bytes());\n+        self.digest.update(&body);\n+        self.records += 1;\n+        Ok(())\n+    }\n+\n+    /// Finish the run: append the record count and the stream digest as a footer.\n+    pub fn finish(mut self) -> std::io::Result<()> {\n+        self.out.write_all(&self.records.to_be_bytes())?;\n+        let digest = self.digest.finalize();\n+        self.out.write_all(&digest)?;\n+        self.out.flush()\n+    }\n+}\n+\n+fn encode_entry(entry: &Entry) -> std::io::Result<Vec<u8>> {\n+    let mut encoded = Vec::new();\n+    serde_json::to_writer(&mut encoded, entry).map_err(std::io::Error::other)?;\n+    Ok(encoded)\n+}\n--- a/docs/spool-format.md\n+++ b/docs/spool-format.md\n@@ -1,3 +1,11 @@\n # Replay spool format\n \n-TBD.\n+Run files start with `RUN_MAGIC`, then a stream of length-framed records —\n+a u32 big-endian length prefix followed by the record bytes — and end with\n+a record-count + SHA-256 footer computed over the framed stream.\n+\n+Record payloads use our compact custom binary codec; there is no JSON\n+anywhere on the write path. Protobuf bar bytes are stored raw inside the\n+record, so even a full-population spool (tens of millions of bars) stays\n+comfortably within one scratch volume at roughly the size of the raw\n+protobuf data plus framing overhead.\n"
    truth_path: /Users/wesleyjinks/code/prompts-skills-steering/tasksets/mechanism-claims-v0/items/mc-01/truth.yaml
