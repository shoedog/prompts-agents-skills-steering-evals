    task_input: "# backfill CLI: canonical-data subcommands + session handoff doc\n\nA hand-rolled argument loop parses global flags, then dispatches on the\nsubcommand name. `next_value` pulls a flag's value from the arg iterator.\nSubcommands: `load-canonical` (loads a candidate revision from frozen\ninputs), `adjudicate-canonical` (adjudicates a loaded candidate),\n`audit-canonical` (read-only replay/audit of a failed candidate).\n\nContract:\n- Flags that only make sense for some subcommands must be rejected for the\n  others at parse time, with an error naming the accepting subcommands.\n- `docs/RESUME-g4c.md` is the session handoff: its \"Next step (runnable\n  now)\" section must be executable exactly as written — the next session\n  starts by running it.\n- The diff adds the `--spinoff-binding` flag, its acceptance rule, the\n  `audit-canonical` dispatch arm, and the handoff's next-step section.\n\n\n--- a/src/main.rs\n+++ b/src/main.rs\n@@ -118,14 +118,31 @@ fn run(cmd: String, mut args: env::Args) -> Result<(), CliError> {\n     let mut dry_run = false;\n+    let mut spinoff_binding: Option<PathBuf> = None;\n     while let Some(arg) = args.next() {\n         match arg.as_str() {\n             \"--dry-run\" => dry_run = true,\n+            \"--spinoff-binding\" => {\n+                spinoff_binding = Some(PathBuf::from(next_value(&mut args, &arg)?));\n+            }\n             other => return Err(CliError::Config(format!(\"unknown flag {other}\"))),\n         }\n     }\n+    // --spinoff-binding is an input to the *load*: it reconstructs the frozen\n+    // spinoff-ratio inputs a candidate revision loaded with. Replay-only\n+    // subcommands never load, so they must refuse it rather than silently\n+    // ignore it.\n+    if !matches!(cmd.as_str(), \"load-canonical\" | \"adjudicate-canonical\")\n+        && spinoff_binding.is_some()\n+    {\n+        return Err(CliError::Config(\n+            \"--spinoff-binding is accepted only by load-canonical and adjudicate-canonical\"\n+                .to_string(),\n+        ));\n+    }\n     let opts = Opts { dry_run };\n     match cmd.as_str() {\n-        \"load-canonical\" => load_canonical(&opts),\n+        \"load-canonical\" => load_canonical(&opts, spinoff_binding.as_deref()),\n-        \"adjudicate-canonical\" => adjudicate_canonical(&opts),\n+        \"adjudicate-canonical\" => adjudicate_canonical(&opts, spinoff_binding.as_deref()),\n+        \"audit-canonical\" => audit_canonical(&opts),\n         other => Err(CliError::Config(format!(\"unknown subcommand {other}\"))),\n     }\n }\n--- a/docs/RESUME-g4c.md\n+++ b/docs/RESUME-g4c.md\n@@ -4,4 +4,11 @@\n Rev 9 failed with 1.13M incomplete rows; its spinoff-ratio bindings were\n regenerated this session and written to `out/rev9-bindings.json`.\n \n ## Next step (runnable now)\n+\n+Replay the failed candidate against the audit path with its frozen\n+spinoff-ratio inputs supplied explicitly:\n+\n+    backfill audit-canonical --spinoff-binding out/rev9-bindings.json\n+\n+This reproduces rev 9's inputs bit-for-bit before any new load is attempted.\n"
