    task_input: "# replay_spool: compaction + seal for the external-sort spool\n\nThe spool spills sorted \"run\" files to a scratch directory; SpoolDir tracks\nthem in `self.runs`. `merge_sorted(inputs, out)` k-way-merges input runs\ninto one output run. `fsync_file` makes a run durable. MERGE_FANIN is the\nmerge fan-in constant (8). Scratch space is shared with other jobs and is\nthe binding constraint at full-population scale.\n\nContract:\n- Compaction and sealing must never delete the only durable copy of data.\n- `CHANGELOG.md` entries are operator-facing: capacity planning for shared\n  scratch volumes is done from them, so their claims must be accurate.\n- The diff adds group-wise compaction, sealing, and the changelog entry.\n\n\n--- a/src/replay_spool.rs\n+++ b/src/replay_spool.rs\n@@ -204,9 +204,38 @@ impl SpoolDir {\n     fn next_run_path(&mut self, kind: &str) -> PathBuf {\n         self.seq += 1;\n         self.dir.join(format!(\"{kind}-{:020}.run\", self.seq))\n     }\n \n+    /// Merge run files group-by-group, deleting each group's inputs as soon\n+    /// as the group's merged run is durable.\n+    pub fn compact_runs(&mut self) -> Result<()> {\n+        while self.runs.len() > MERGE_FANIN {\n+            let group: Vec<PathBuf> = self.runs[..MERGE_FANIN].to_vec();\n+            let merged = self.next_run_path(\"merge\");\n+            merge_sorted(&group, &merged)?;\n+            fsync_file(&merged)?;\n+            self.runs.drain(..MERGE_FANIN);\n+            self.runs.push(merged);\n+            for run in &group {\n+                fs::remove_file(run)?;\n+            }\n+        }\n+        Ok(())\n+    }\n+\n+    /// Produce the final sealed run the emitter reads back.\n+    pub fn seal(mut self) -> Result<PathBuf> {\n+        self.compact_runs()?;\n+        let sealed = self.dir.join(\"sealed.run\");\n+        merge_sorted(&self.runs, &sealed)?;\n+        fsync_file(&sealed)?;\n+        for run in &self.runs {\n+            fs::remove_file(run)?;\n+        }\n+        Ok(sealed)\n+    }\n+\n     pub fn scratch_bytes(&self) -> u64 {\n         self.runs.iter().filter_map(|p| fs::metadata(p).ok()).map(|m| m.len()).sum()\n     }\n }\n--- a/CHANGELOG.md\n+++ b/CHANGELOG.md\n@@ -1,2 +1,9 @@\n # Changelog\n \n+## Unreleased\n+\n+- Spool compaction deletes each merge group's inputs as soon as the group's\n+  merged run is fsynced. Peak scratch usage is therefore bounded by one\n+  merge group at every stage, including seal: the old 2x (all remaining\n+  runs + full sealed output) high-water mark at seal time is gone.\n+\n"
