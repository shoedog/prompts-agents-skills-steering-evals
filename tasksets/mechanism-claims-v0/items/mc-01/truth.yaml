defects:
- id: mc-01-d1
  defect_class: mechanism misattribution (doc claims custom binary codec, write path is serde_json)
  location: 'docs/spool-format.md claim vs src/replay_spool.rs: encode_entry()'
  hunk_lines: the "compact custom binary codec / no JSON anywhere on the write path" doc lines vs the
    encode_entry() body in the new-file hunk
  description: 'The format doc added by this diff claims records use "our compact custom binary codec"
    with "no JSON anywhere on the write path" and protobuf bar bytes "stored raw". But encode_entry()
    serializes every record with `serde_json::to_writer` — only the framing (magic, u32 BE length
    prefixes, footer) is binary; the payload is JSON, and the `market_bar: Vec<u8>` protobuf bytes are
    rendered by serde_json as a JSON array of decimal integers (~3-4 chars per byte), not stored raw.'
  root_cause: the doc was written from the framing layer's appearance (magic bytes, length prefixes,
    digest) without tracing the record encoding; encode_entry() is the only line that decides the
    payload encoding and it calls serde_json.
  bad_behavior: 'operators sizing scratch volumes from the doc under-provision by roughly 3-4x on the
    bar bytes alone (JSON-array blow-up of already-encoded protobuf), exactly the full-population
    disk blow-up class the doc claims cannot happen.'
  minimal_trigger: 'push() one Entry whose market_bar is 20 protobuf bytes: the doc predicts ~20 bytes
    plus framing; the actual framed record is a JSON object where those bytes alone render as ~60-80
    characters of "[10,23,45,...]".'
  acceptable_match: any finding that the record payload is serde_json / JSON (naming encode_entry or
    its `serde_json::to_writer` line in src/replay_spool.rs) contradicting the doc's custom-binary /
    no-JSON / raw-protobuf claim. Either direction (doc wrong, or code not matching doc) counts.
    CITATION REQUIRED — the finding must point at the implementing write-path line(s) (encode_entry /
    the serde_json call), not only at the doc hunk.
  reject_if: a finding that merely calls the encoding inefficient or the doc "possibly stale" without
    naming the serde_json payload vs binary-framing split; a finding that endorses or restates the
    custom-binary claim; or a finding citing only docs/spool-format.md lines with no reference to the
    implementing line(s) in src/replay_spool.rs (citation absent or citation-incorrect).
