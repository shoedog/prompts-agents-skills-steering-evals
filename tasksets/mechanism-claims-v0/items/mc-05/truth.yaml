    mining/scripts/detect_failure_signatures.py pipe_truncated_test'
  detector_rows: 'mining/out/failure_signatures.jsonl: detector=admission session=608a7a2a
    line_no=2692; detector=pipe_truncated_test rows across sessions'
rubric_emphasis: 'claim-has-citation AND citation-correct — credit requires naming the pipeline line
