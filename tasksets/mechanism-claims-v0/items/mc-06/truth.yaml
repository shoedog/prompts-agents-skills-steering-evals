clean_rationale: every mechanism claim in the format doc checks out against the write path it
  documents. Framing binary — create() writes RUN_MAGIC, push() writes u32 BE length prefixes
  (len.to_be_bytes), finish() writes the count + Sha256 footer over exactly the framed bytes the
  digest.update calls covered. Payload serde_json — push() encodes via serde_json::to_vec, so the
  protobuf market_bar bytes (a Vec<u8>) do serialize as a JSON integer array with the stated ~3-4x
  blow-up. The
  doc claims the trade is deliberate and scopes the writer to the small target-only population,
  matching the context; it directs operators to size scratch from JSON record sizes. Doc and code
  agree; there is no defect to report.
tempting_non_defects:
- the binary magic header, length prefixes, and SHA-256 footer "contradict the JSON claim" — they do
  not; the doc says framing is binary and the payload is JSON, which is exactly what create/push/finish
  implement.
- storing protobuf bytes inside JSON is a 3-4x size blow-up and "should be flagged as the spool
  disk-usage bug" — the blow-up is real, stated in the doc itself, and deliberately scoped to the small
  population; reporting it as a defect repeats the doc instead of contradicting it.
- names like TargetRunWriter / RUN_MAGIC "imply a custom binary codec, so the doc must be wrong about
  JSON" — the names describe the framing layer; the payload encoding is decided by the serde_json call,
  which matches the doc.
- push() uses serde_json::to_vec while the sibling full-population spool uses to_writer; a style
  difference, not a defect.
