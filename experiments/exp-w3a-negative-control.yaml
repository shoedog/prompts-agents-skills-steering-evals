# DRAFT (2026-07-25) — negative-control companion to exp-w3a-cite-or-label, per the
# exp2 convention: same baseline, taskset, executor, judge and budget, but the treatment
# composes the inert narrative element. If treatment beats baseline here, the harness is
# measuring noise on this taskset (harness_broken flags and the run exits 2).
# Run AFTER (or alongside) exp-w3a-cite-or-label on the SAME verified taskset revision.
