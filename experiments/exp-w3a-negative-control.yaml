judge: {provider: codex, model: gpt-5.5, effort: medium, rubric: harness/rubrics/review_judge.md, schema: harness/rubrics/review_judge.schema.json}
token_budget: {max_cost_usd: 10.0, max_items: 7}
negative_control: true
